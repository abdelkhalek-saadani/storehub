name: CI/CD

on:
  push:
    branches: [main]

# Never run two pipelines/deploys at once; let a running deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /opt/storehub

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        service: [order-service, catalog-service, payment-service]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Unit + integration tests (Testcontainers works on GitHub runners)
      - name: Run tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/*-reports/
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
          CYPRESS_INSTALL_BINARY: 0
        run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build -- --configuration e2e

  build-and-push:
    name: Build & push (${{ matrix.name }})
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: catalog-service, context: backend/catalog-service }
          - { name: payment-service, context: backend/payment-service }
          - { name: order-service, context: backend/order-service }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates lowercase image name + tags (sha and latest)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    name: E2E (Cypress)
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: docker compose -f compose.e2e.yml pull

      # Compose up + seed test data
      - name: Start stack
        run: make e2e-up

      - name: Seed ( Using Cypress script)
        uses: cypress-io/github-action@v6
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        with:
          working-directory: frontend
          spec: cypress/e2e/seed/seed.cy.ts
          wait-on: http://localhost:8080
          wait-on-timeout: 180

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          spec: cypress/e2e/checkout-flow/checkout-flow.cy.ts
          wait-on: http://localhost:8080
          wait-on-timeout: 180

      - name: Collect compose logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > compose.log

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/cypress/screenshots
            frontend/cypress/videos
            compose.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: make e2e-down

  deploy:
    name: Deploy, smoke test & rollback
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # manual approval live here and secrets
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Record previous release tag
        id: prev
        run: |
          tag=$(ssh "$SSH_TARGET" "cat $DEPLOY_DIR/.release_tag 2>/dev/null || echo none")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload compose file
        run: scp compose.prod.yml "$SSH_TARGET:$DEPLOY_DIR/compose.prod.yml"

      - name: Upload keycloak files
        run: |
          ssh "$SSH_TARGET" "mkdir -p $DEPLOY_DIR/keycloak"
          scp -r ./keycloak/realm-data "$SSH_TARGET:$DEPLOY_DIR/keycloak/"
          scp -r ./keycloak/keycloak-themes/ "$SSH_TARGET:$DEPLOY_DIR/keycloak/"

      - name: Upload order db init file
        run: |
          ssh "$SSH_TARGET" "mkdir -p $DEPLOY_DIR/backend/order-service/src/main/resources/init-scripts"
          scp -r ./backend/order-service/src/main/resources/init-scripts "$SSH_TARGET:$DEPLOY_DIR/backend/order-service/src/main/resources/"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SSH_TARGET" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "$SSH_TARGET" "set -e; cd $DEPLOY_DIR
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f compose.prod.yml pull
            docker compose -f compose.prod.yml up -d --remove-orphans --wait
            echo \$IMAGE_TAG > .release_tag
            docker logout ghcr.io
            docker image prune -f"

      - name: Smoke test
        env:
          SMOKE_URLS: ${{ vars.SMOKE_URLS }} # frontend + each service /actuator/health
        run: |
          for url in $SMOKE_URLS; do
            echo "Checking $url"
            curl --fail --silent --show-error --output /dev/null \
              --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "$url"
          done

      - name: Roll back to previous release
        if: failure() && steps.prev.outputs.tag != 'none'
        run: |
          ssh "$SSH_TARGET" "set -e; cd $DEPLOY_DIR
            export IMAGE_TAG=${{ steps.prev.outputs.tag }}
            docker compose -f compose.prod.yml up -d --pull never --remove-orphans
            echo \$IMAGE_TAG > .release_tag"