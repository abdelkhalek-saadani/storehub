services:
  auth-server:
    image: quay.io/keycloak/keycloak:26.1.1
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: auth-server-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: ${KC_PORT:-8088}
      KC_HOSTNAME: ${KC_HOSTNAME:-auth-server}
      KC_HOSTNAME_PORT: ${KC_PORT:-8088}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - ${KC_PORT:-8088}:${KC_PORT:-8088}
      - "9000:9000"
    volumes:
      - ./realm-data/:/opt/keycloak/data/import
      - ./keycloak-themes/storehub:/opt/keycloak/themes/storehub
    depends_on:
      auth-server-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  auth-server-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

