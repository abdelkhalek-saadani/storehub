spring:
  application:
    name: catalog
    cors.allowed-origins: ${FRONTEND_URL:http://localhost:4200}
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_BASE_URL:http://auth-server:8088}/realms/storehub
          jwk-set-uri: ${KC_BASE_URL:http://auth-server:8088}/realms/storehub/protocol/openid-connect/certs

      client:
        registration:
          internal-service:
            provider: storehub-keycloak
            client-id: order-internal
            client-secret: ${ORDER_INTERNAL_SECRET:**********}
            authorization-grant-type: client_credentials
        provider:
          storehub-keycloak:
            token-uri: ${KC_BASE_URL:http://auth-server:8088}/realms/storehub/protocol/openid-connect/token

logging:
  level:
    com.abdelkhalek.storehub: DEBUG
    org:
      springframework:
        web:
          servlet:
            mvc:
              method:
                annotation:
                  ExceptionHandlerExceptionResolver: ERROR

storehub:
  internal-client-registration: internal-service
  admin-client-registration: keycloak-admin
  order-base-url: ${ORDER_BASE_URL:http://localhost:8080}
  kc-base-url: ${KC_BASE_URL:http://auth-server:8088}
  realm: storehub
  rabbit.exchange: storehub.exchange

server:
  port: 8082

management:
  endpoints:
    access:
      default: none

