services:
  frontend:
    image: ghcr.io/abdelkhalek-saadani/storehub/frontend:${IMAGE_TAG:-e2e}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KC_URL: ${KC_URL:-http://auth-server:8088}
      ORDER_URL: ${ORDER_URL:-http://localhost:8090}
      CATALOG_URL: ${CATALOG_URL:-http://localhost:8100}
    ports:
      - "8080:8080"

  angular-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: host
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    profiles:
      - dev

  angular-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "test", "--", "--watch=false"]
    profiles:
      - test
