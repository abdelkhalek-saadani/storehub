spring:
  application:
    name: Payment Service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: payment_user
    password: payment_password
  # JPA settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_BASE_URL}/realms/storehub
          jwk-set-uri: ${KC_BASE_URL}/realms/storehub/protocol/openid-connect/certs
      client:
        registration:
          paypal:
            client-id: ${PAYPAL_CLIENT_ID}
            client-secret: ${PAYPAL_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            provider: paypal
        provider:
          paypal:
            token-uri: ${paypal.base-url}/v1/oauth2/token

logging:
  level:
    com.abdelkhalek.storehub.payment: DEBUG


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


server:
  port: 8083

storehub:
  rabbit.exchange: storehub.exchange

paypal:
  base-url: https://api.sandbox.paypal.com
  webhook:
    id: 5HM86695C73415230
  return-url: http://localhost:4200/checkout/return
  cancel-url: http://localhost:4200/checkout/cancel


management:
  web:
    exposure:
      include: "health"