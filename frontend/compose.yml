services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: frontend-image
    environment:
      KC_PORT: ${KC_PORT:-8088}
      KC_HOSTNAME: ${KC_HOSTNAME:-auth-server}
    ports:
      - "8080:8080"

  angular-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: host
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    profiles:
      - dev

  angular-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "test", "--", "--watch=false"]
    profiles:
      - test
